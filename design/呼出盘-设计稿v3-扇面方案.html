<body style="margin:0;background:#eef0f3">

    <circle cx="0" cy="0" r="192" fill="#ffffff" stroke="#dde2e8" stroke-width="2"/>

    <path d="M53.89 -21.45 L172.82 -68.77 A186 186 0 0 1 172.82 68.77 L53.89 21.45 A58 58 0 0 0 53.89 -21.45 Z" fill="#0067c0" opacity=".14"/>

    <rect x="94" y="-26" width="52" height="52" rx="16" fill="#e5484d"/>

    <g transform="translate(0 120) scale(2)"><use href="#ic-hl"/></g>

  <text x="1096" y="654" class="note" text-anchor="middle">焦点扇面 29→93；颜色仍走「色片 + 强调描边」，不压蓝底</text>

  <!-- ================= 页脚 ================= -->
  <text x="32" y="722" class="foot">扇区顺序（北起顺时针）：笔 → 黑 → 红 → 蓝 → 荧光笔 → 橡皮 → 框选 → 激光</text>
  <text x="32" y="750" class="foot">输入完全不变：死区 24 · 锁定 36 · 45°/格 · 跨扇滞回 9°（扇面只是画法）</text>
  <text x="32" y="778" class="foot">全扇面关键尺寸：环带 40→96（深 56） · 图标 24 居中在 R68（内外各留 16） · 缝 2° ≈ 2.4px · 中央读数 R34</text>
